<div class="preview-card-container">
  <!-- Header  -->
  <div class="preview-header-bar">
    <div class="preview-title-group">
      <i class="fa-solid fa-wand-magic-sparkles preview-icon"></i>
      <h2 class="preview-title-text">Inference Preview Engine</h2>
    </div>

    <!-- Status Indicator -->
    <span class="flex h-2 w-2 relative">
      @if (webcamService.previewImage()) {
        <span
          class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"
        ></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
      } @else {
        <span class="relative inline-flex rounded-full h-2 w-2 bg-slate-600"></span>
      }
    </span>
  </div>
  <!-- Control Actions -->
  <div class="preview-action-bar">
    @if (webcamService.previewImage()) {
      <button class="process-img-btn" (click)="processImageResults()">
        <i class="fa-solid fa-arrow-rotate-right text-xs ml-1"></i>
      </button>
    } @else {
      <button class="process-img-btn-gray" disabled>
        <span>Awaiting Input Payload</span>
        <i class="fa-solid fa-ban text-xs ml-1"></i>
      </button>
    }
  </div>

  <div class="preview-viewport-wrapper">
    @if (webcamService.previewImage()) {
      <img
        [src]="webcamService.previewImage()"
        class="img-contain-style"
        alt="Inference Input Target Source"
      />
    } @else {
      <i class="fa-solid fa-image-blur fallback-icon"></i>
      <span class="fallback-text">No image source staged for evaluation</span>
    }
  </div>
</div>
