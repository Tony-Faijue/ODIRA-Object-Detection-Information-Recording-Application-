<div class="upload-card-container">
  <!-- Upload Header -->
  <div class="upload-header-bar">
    <div class="upload-title-group">
      <i class="fa-solid fa-file-arrow-up upload-icon"></i>
      <h2 class="upload-title-text">Image Upload</h2>
    </div>
    <!-- File Status Indicator -->
    <span class="flex h-2 w-2 relative">
      @if (imageData.get('imageFile')?.value?.name) {
        <span
          class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"
        ></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
      } @else {
        <span class="relative inline-flex rounded-full h-2 w-2 bg-slate-600"></span>
      }
    </span>
  </div>

  <!-- Upload Form -->
  <form [formGroup]="imageData" (ngSubmit)="onFormSubmit()" class="upload-form-body">
    <!-- Custom Upload Zone label -->
    <label for="image_upload" class="upload-dropzone-trigger group">
      <!-- Icon Wrapper -->
      <div class="dropzone-icon-box">
        <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
      </div>
      <!-- Action Headings -->
      <span class="dropzone-main-text">Click to choose image file</span>
      <span class="dropzone-sub-text">Supports JPG & PNG source formats</span>

      <!-- Hidden Native File Input -->
      <input
        type="file"
        id="image_upload"
        class="hidden-file-input"
        (change)="onFileSelected($event)"
        required
      />
    </label>

    <!-- File Name Display -->
    @if (imageData.get('imageFile')?.value) {
      <div
        class="bg-slate-950/60 border border-slate-900 rounded-lg p-3 flex items-center justify-between text-xs font-medium text-slate-400 w-full font-mono"
      >
        <span class="flex items-center truncate mr-2">
          <i class="fa-solid fa-circle-check text-emerald-400 mr-2 text-sm"></i>
          <span
            class="text-slate-300 truncate max-w-[220px]"
            title="{{ imageData.get('imageFile')?.value?.name }}"
            >{{ imageData.get('imageFile')?.value?.name }}</span
          >
        </span>
        <span
          class="text-emerald-400/80 uppercase tracking-wider text-[10px] bg-emerald-500/10 border border-emerald-500/20 px-1.5 py-0.5 rounded shrink-0"
          >Staged</span
        >
      </div>
    }
    <button
      type="submit"
      [disabled]="!imageData.get('imageFile')?.value"
      class="upload-submit-button"
    >
      Initialize Processing Core
    </button>
  </form>
</div>
