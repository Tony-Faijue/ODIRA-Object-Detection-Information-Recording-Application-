<div class="container max-w-full">
  <!-- Main menu -->
  <header class="nav-background">
    <div class="nav-layout">
      <div class="title-and-version-style">
        <span class="title-style">ODIRA</span>
        <span class="vModel">v1 Model</span>
      </div>
      <nav class="nav-menu">
        <a [routerLink]="['/']" class="heading">DASHBOARD</a>
        <a [routerLink]="['/about']" class="heading">ABOUT</a>
      </nav>
    </div>
  </header>

  <!-- ODIRA Content -->
  <main class="odira-content">
    <!-- Left Panel -->
    <section class="left-column">
      <div class="dashboard-card">
        <app-webcam-window />
      </div>
      <div class="dashboard-card">
        <app-result-component />
      </div>
    </section>

    <!-- Right Column -->
    <aside class="right-column">
      <div class="dashboard-card">
        <app-settings />
      </div>
      <div class="dashboard-card">
        <app-upload-image />
      </div>
      <div class="dashboard-card">
        <app-image-preview />
      </div>
    </aside>
  </main>
</div>
