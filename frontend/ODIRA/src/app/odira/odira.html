<div class="container max-w-full">
  <!-- Main menu -->
  <header class="nav-background">
    <div class="nav-layout">
      <div class="title-and-version-style">
        <span class="title-style">ODIRA</span>
        <span class="vModel">v1 Model</span>
      </div>
      <nav class="nav-menu">
        <a [routerLink]="['/']"><h1 class="heading">DASHBOARD</h1></a>
        <a [routerLink]="['/about']"><h1 class="heading">ABOUT</h1></a>
      </nav>
    </div>
  </header>

  <!-- ODIRA Content -->
  <div class="odira-content">
    <!-- Left Column -->
    <div class="left-column">
      <div class="webcam-component">
        <app-webcam-window />
      </div>
      <div class="result-component">
        <app-result-component />
      </div>

    <!-- Right Column -->
    <div class="right-column">
      <div class="settings-component">
        <app-settings />
      </div>
      <div class="upload-image-component">
        <app-upload-image />

        <app-image-preview />
      </div>
    </div>
